services:
  - type: web
    name: unibo-time-manager-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: unibo_time_manager
      - key: REQUIRE_MONGODB
        value: "true"
